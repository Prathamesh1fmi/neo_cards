name: "Build NeoCards"
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-20.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
          
      - name: Install Frontend Dependencies
        run: npm ci

      - name: Disable Auto-Updater (Missing Keys)
        # Bypasses the requirement for TAURI_PRIVATE_KEY since we aren't signing a production release here.
        run: |
          node -e "const fs = require('fs'); const path = 'src-tauri/tauri.conf.json'; const config = JSON.parse(fs.readFileSync(path)); config.tauri.updater.active = false; fs.writeFileSync(path, JSON.stringify(config, null, 2));"

      - name: Build Tauri App
        run: npm run tauri build
        
      - name: Upload Windows Installers
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: NeoCards-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          
      - name: Upload macOS Installers
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: NeoCards-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
          
      - name: Upload Linux Installers
        if: matrix.platform == 'ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: NeoCards-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb